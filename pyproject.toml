[project]
name = "career-autofill-agent"
version = "0.1.0"
description = "Two MCP servers for evidence-based career matching and job application autofill."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.20,<2",
  "playwright>=1.55,<2",
  "pydantic>=2.11,<3",
]

[project.scripts]
career-match-mcp = "career_autofill.bootstrap:match_main"
career-autofill-mcp = "career_autofill.bootstrap:autofill_main"
career-autofill = "career_autofill.bootstrap:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/career_autofill"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.13,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
